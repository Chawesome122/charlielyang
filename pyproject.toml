[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "weaponized-interdependence"
version = "0.1.0"
description = "Auditable research on semiconductor controls and rare-earth resilience"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3", "scipy>=1.15,<2", "pandas>=2.2,<3",
  "matplotlib>=3.10,<4", "PyYAML>=6,<7", "requests>=2.32,<3",
  "beautifulsoup4>=4.13,<5", "pydantic>=2.10,<3",
  "statsmodels>=0.14,<0.15", "sympy>=1.13,<2"
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/weaponized"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

